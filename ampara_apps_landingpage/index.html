<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amparo - Descarregar Aplicativo</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            text-align: center; 
            padding: 40px 20px; 
            background: #0f172a; 
            color: #f8fafc;
        }
        .container { max-width: 400px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        h1 { font-size: 24px; margin-bottom: 10px; color: #ffffff; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 30px; }
        .btn { 
            display: block; 
            width: 100%; 
            box-sizing: border-box;
            margin: 15px 0; 
            padding: 14px; 
            font-size: 16px; 
            font-weight: 600;
            color: white; 
            text-decoration: none; 
            border-radius: 10px; 
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-android { background: #10b981; }
        .btn-ios { background: #3b82f6; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Amparo (Versão Criança)</h1>
        <p>Aceda à versão dedicada selecionando o seu sistema operativo abaixo:</p>
        
        <!-- Botão para Android (Substitui pelo link direto do APK ou Play Store) -->
        <a href="URL_DO_TEU_APK_OU_PLAYSTORE" class="btn btn-android">Descarregar para Android</a>
        
        <!-- Botão para iOS (Substitui pelo link de convite do TestFlight privado) -->
        <a href="URL_DO_TESTFLIGHT_PRIVADO" class="btn btn-ios">Descarregar para iOS (iPhone)</a>
    </div>
</body>
</html>
