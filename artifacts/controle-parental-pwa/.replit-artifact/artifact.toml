kind = "web"
previewPath = "/pwa/"
title = "Amparo PWA"
description = "Versão PWA do Amparo para responsáveis e crianças organizarem contatos aprovados, atividade compartilhada e conversas privadas sem dados de demonstração."
version = "1.0.0"
id = "artifacts/controle-parental-pwa"
router = "path"

[[services]]
name = "web"
paths = [ "/pwa/" ]
localPort = 22808

[services.development]
run = "pnpm --filter @workspace/controle-parental-pwa run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/controle-parental-pwa", "run", "build" ]
serve = "static"
publicDir = "artifacts/controle-parental-pwa/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22808"
BASE_PATH = "/pwa/"
