kind = "mobile"
previewPath = "/"
title = "Controle Parental"
description = "Aplicativo mobile para responsáveis acompanharem com transparência a comunicação, localização e tempo de uso das crianças, com aprovação de contatos e canal privado entre responsável e criança."
version = "1.0.0"
id = "artifacts/controle-parental"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 20002

[services.development]
run = "pnpm --filter @workspace/controle-parental run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/controle-parental", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/controle-parental", "run", "serve" ]

[services.env]
PORT = "20002"
BASE_PATH = "/"
